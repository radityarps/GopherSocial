services:
  db:
    image: postgres:17-alpine
    container_name: gophersocial-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-gophersocial}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-gophersocial}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - gophersocial-net

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gophersocial-api
    restart: unless-stopped
    ports:
      - "${PORT:-8080}:8080"
    env_file:
      - .env
    environment:
      # In Docker network, database hostname is 'db' rather than 'localhost'
      - DB_ADDR=postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-gophersocial}?sslmode=disable
    volumes:
      - .:/app
    depends_on:
      db:
        condition: service_healthy
    networks:
      - gophersocial-net

volumes:
  pgdata:

networks:
  gophersocial-net:
    driver: bridge
